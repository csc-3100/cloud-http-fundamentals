name: Build Java examples
on:
  pull_request:
  push:
    branches: [main]
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile direct HTTP and TULIP examples
        run: mvn --batch-mode --no-transfer-progress -Ptulip clean compile
